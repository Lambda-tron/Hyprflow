general {
    lock_cmd = pidof hyprlock || hyprlock          # Single guarded instance
    before_sleep_cmd = loginctl lock-session       # Lock before suspend (lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'     # Wake screens after resume (Lua syntax)
}

listener {
    timeout = 400                                  # Seconds
    on-timeout = loginctl lock-session            # Lock screen
}
