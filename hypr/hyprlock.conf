# ╭──────────────────────────────────────────╮
# │         hyprlock — Catppuccin Mocha       │
# ╰──────────────────────────────────────────╯

general {
    disable_loading_bar   = true
    hide_cursor           = true
    grace                 = 0
    no_fade_in            = false
    no_fade_out           = false
}


# ─── Background ───────────────────────────────────────────────────────────────

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.5
    contrast    = 1.0
    vibrancy    = 0.2
}


# ─── Profile Picture ──────────────────────────────────────────────────────────

image {
    monitor  =
    path     = ~/.config/hypr/image.jpg

    size     = 120
    rounding = -1   # -1 = fully circular

    border_size  = 3
    border_color = rgb(cba6f7)   # Mauve

    position = 0, 120
    halign   = center
    valign   = center
}


# ─── Time ─────────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color    = rgba(cdd6f4ff)   # Text
    font_size   = 96
    font_family = 3270 Nerd Font

    position = 0, -20
    halign   = center
    valign   = center
}


# ─── Date ─────────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color    = rgba(a6adcbaa)   # Subtext0 (slightly muted)
    font_size   = 18
    font_family = 3270 Nerd Font

    position = 0, -130
    halign   = center
    valign   = center
}


# ─── Password Input ───────────────────────────────────────────────────────────

input-field {
    monitor  =
    size     = 280, 52

    # Colors
    outer_color         = rgb(313244)   # Surface0
    inner_color         = rgb(1e1e2e)   # Base
    font_color          = rgb(cdd6f4)   # Text
    check_color         = rgb(a6e3a1)   # Green
    fail_color          = rgb(f38ba8)   # Red
    caps_lock_color     = rgb(f9e2af)   # Yellow

    # Style
    rounding            = 12
    outline_thickness   = 2

    # Placeholder
    placeholder_text    = <i>Enter password…</i>
    hide_input          = false
    dots_size           = 0.28
    dots_spacing        = 0.25
    dots_center         = true
    dots_rounding       = -1

    fade_on_empty       = true
    fade_timeout        = 1500

    fail_text           = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition     = 300

    position = 0, -230
    halign   = center
    valign   = center
}


# ─── Greeting ─────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = Hey, $USER 
    color    = rgba(cba6f7cc)   # Mauve, slightly transparent
    font_size   = 14
    font_family = 3270 Nerd Font

    position = 0, -295
    halign   = center
    valign   = center
}
