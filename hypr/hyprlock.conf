# ╭──────────────────────────────────────────╮
# │   hyprlock — Catppuccin Mocha / Futurist  │
# ╰──────────────────────────────────────────╯

$font = JetBrainsMono Nerd Font

# ─── General ────────────────────────────────────────────────────────────────

general {
    hide_cursor         = true
    ignore_empty_input  = true
}


# ─── Background ───────────────────────────────────────────────────────────────

background {
    monitor          =
    path             = screenshot
    blur_passes      = 4
    blur_size        = 8
    brightness       = 0.45
    contrast         = 1.05
    vibrancy         = 0.25
    vibrancy_darkness = 0.3
    noise            = 0.02
}


# ─── Profile Picture ──────────────────────────────────────────────────────────

image {
    monitor  =
    path     = ~/.config/hypr/image.jpg

    size     = 120
    rounding = -1   # -1 = fully circular

    border_size  = 3
    border_color = rgba(cba6f7ee) rgba(89b4faee) 45deg   # Mauve -> Blue

    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = rgba(cba6f766)
    shadow_boost  = 1.2

    position = 0, 140
    halign   = center
    valign   = center
}


# ─── Time ─────────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color    = rgba(cdd6f4ff)   # Text
    font_size   = 100
    font_family = $font

    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = rgba(89b4fa88)
    shadow_boost  = 1.4

    position = 0, -10
    halign   = center
    valign   = center
}


# ─── Date ─────────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color    = rgba(b4befeee)   # Lavender
    font_size   = 18
    font_family = $font

    position = 0, -130
    halign   = center
    valign   = center
}


# ─── Battery ──────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = cmd[update:15000] ~/.config/hypr/scripts/lock-battery.sh
    font_size   = 16
    font_family = $font

    position = 0, -164
    halign   = center
    valign   = center
}


# ─── Password Input ───────────────────────────────────────────────────────────

input-field {
    monitor  =
    size     = 280, 54

    # Colors
    outer_color         = rgba(cba6f7ee) rgba(89b4faee) 45deg
    inner_color         = rgba(1e1e2ecc)   # Base, slightly translucent
    font_color          = rgb(cdd6f4)      # Text
    check_color         = rgba(a6e3a1ee) rgba(94e2d5ee) 90deg
    fail_color          = rgba(f38ba8ee) rgba(eba0acee) 90deg
    capslock_color      = rgb(f9e2af)      # Yellow

    # Style
    rounding            = 16
    outline_thickness   = 3

    # Placeholder
    placeholder_text    = <i>Enter password…</i>
    hide_input          = false
    dots_size           = 0.28
    dots_spacing        = 0.25
    dots_center         = true
    dots_rounding       = -1

    fade_on_empty       = true
    fade_timeout        = 1500

    fail_text           = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -240
    halign   = center
    valign   = center
}


# ─── Greeting ─────────────────────────────────────────────────────────────────

label {
    monitor  =
    text     = 󰌾  Hey, $USER
    color    = rgba(cba6f7cc)   # Mauve, slightly transparent
    font_size   = 14
    font_family = $font

    position = 0, -310
    halign   = center
    valign   = center
}
